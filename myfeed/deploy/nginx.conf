# myfeed 的入口。**全栈唯一对外发布端口的容器**。
#
# ---------- 它负责四件事 ----------
#
#   1. 服务 SPA 产物（frontend/dist），并做 history 模式的回退
#   2. /api/   → 去掉前缀转发给 Go（后端路由是 /feed/search，不是 /api/feed/search）
#   3. /static/ → **原样**转发给 Go（不剥前缀）
#   4. 上传体量上限、SSE 长连接超时
#
# ---------- ⚠ 一条贯穿全文的约束：Docker DNS 的地址会变 ----------
#
# 容器被重建（`docker compose up -d --build api`）之后 IP 通常会变。
# nginx 对 `proxy_pass http://api:8080/` 这种**字面主机名**只在启动时解析一次，
# 之后一直用那个 IP —— 于是重建 api 之后 nginx 把请求发给一个已经不存在的地址，
# 表现是 **502 Bad Gateway**，而 `docker compose ps` 里每个容器都是健康的。
# 这个现象非常容易被误判成"后端崩了"。
#
# 所以下面所有 proxy_pass 都用**变量形式**（`set $api ...` + `proxy_pass $api`）
# 并配上 Docker 内置 DNS 的 resolver，强制每次请求都重查。
# 代价是变量形式的 proxy_pass **不会自动剥 location 前缀**，
# 所以 /api/ 那一处要显式 rewrite —— 这正好也把"去前缀"这件事
# 从"靠一个尾斜杠"变成"写明白的一行"，反而更难写错。

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # 先不上域名（按本次选择走 IP）。将来加域名 + HTTPS 时改三处：
    #   1) server_name 改成你的域名
    #   2) 加一段 listen 443 ssl + 证书路径（certbot 会自动改这个文件）
    #   3) 加一段 80 → 443 的 301 跳转
    server_name _;

    # 不回显 nginx 版本号
    server_tokens off;

    # ---------- 上传体量 ----------
    #
    # 依据是代码里的常量，不是拍脑袋：`internal/video/chunk_entity.go:7`
    # 的 `maxUploadSize = 500 << 20`（500 MB）—— 单文件上限 500 MB，
    # 分片默认 5 MB 但允许开到 500 MB。取 600m 留余量。
    #
    # ⚠ 这个值必须 **≥** 代码里的上限。反过来的话，超限的文件在 nginx 这层
    # 就被挡成 413，**Go 那边的 500MB 校验永远不会触发** ——
    # 于是"上限到底是多少"这件事就有了两个不一致的答案，
    # 而用户看到的报错信息是 nginx 的 HTML 页面，不是后端的 JSON。
    client_max_body_size 600m;

    # ---------- 1) 后端 API ----------
    location /api/ {
        set $api_upstream http://api:8080;

        # 去掉 /api 前缀。**这一行是"前端调 /api/feed/search、后端路由是 /feed/search"
        # 这个映射的唯一实现**，删了或写错就是全站 API 404。
        #
        # 为什么不是靠 proxy_pass 的尾斜杠（http://api:8080/）：那种写法在
        # 变量形式下不生效（见文件顶部）。而 rewrite + break 是显式的：
        #   /api/feed/search  →  /feed/search
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # buildAbsoluteURL（video_handler.go / account_handler.go）会读这个头
        # 拼绝对 URL，而**那个 URL 会被落库**（头像地址、play_url）。
        # 不传的话库里会存下一批 http://<容器名>/static/...。
        # 现在没有 TLS，所以它就是 "http"；上了 HTTPS 之后 nginx 会自动给 "https"。
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 是长连接。应用侧每 30 秒发一次注释帧（ssehub.go 的 sseKeepalive），
        # 所以 nginx 默认的 60 秒读超时**碰巧**不会触发 —— 但那是"靠两个数字
        # 的巧合成立"，改一个就断。显式写死，让这条依赖变成明示的。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 不缓冲请求体：上传分片（最大 500 MB）直接流给 Go，
        # 不在 nginx 的 client_body_temp 里再落一份盘。
        # 2核2G 的机器上磁盘 IO 和磁盘容量都是真成本，
        # 而"多写一遍 500MB 再读出来"是纯浪费。
        # （响应侧**不**关 buffering：SSE 由应用自己发 X-Accel-Buffering: no
        #   来关，那条比在这里一刀切更精确 —— 普通 JSON 响应还是想让 nginx 缓冲的。）
        proxy_request_buffering off;
    }

    # ---------- 2) 静态资源（上传的素材、HLS 产物）----------
    #
    # 转发给 Go 而不是让 nginx 直接读 uploads 目录。**这是刻意的取舍**：
    #
    #   nginx 直接 root 会更快（省一次同机内存拷贝），但会丢掉
    #   internal/http/static.go 那张按扩展名的缓存策略表：
    #       .m3u8 → no-cache（转码/降级的提交点，拿到旧清单等于拿到指向已删产物的清单）
    #       .ts   → immutable 一年（URL 里有 runID，字节保证不变）
    #       .mp4/头像/封面 → 一天
    #   那张表要在 nginx 里重写一遍，就变成"两处各自为政的缓存策略" ——
    #   而缓存策略错了**在浏览器里看不出区别**，只表现为"有时候拿到旧的"。
    #   同时 mountStatic 里还有带 19 个用例的穿越防护。
    #
    # 一次同机内存拷贝在 3~6 Mbps 的出口带宽面前完全不是瓶颈。
    # 换一份唯一真相，值。
    location /static/ {
        set $api_static http://api:8080;
        # **不写 rewrite**：这里要的就是完整原路径 /static/xxx
        proxy_pass $api_static;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 视频/分片不要 nginx 缓冲：缓冲会让它先把整个响应收下来再发，
        # 拖进度条（Range 请求）和小分片拉取的时序都会变形。
        proxy_buffering off;

        # Range 和 If-Range 显式透传。nginx 默认会把客户端请求头转给上游，
        # 但这两条是"拖进度条能不能用"的命门，写出来是为了让它成为明示约定 ——
        # 将来谁要动这里的头，会看到它们在这儿而不是以为"nginx 默认会给"。
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
    }

    # ---------- 3) SPA ----------
    #
    # try_files 的最后一跳（/index.html）**必须有**：
    # vue-router 用的是 createWebHistory（真 URL，不是 #/），而 Go 侧
    # 完全没有兜底路由（全项目没有 go:embed、没有 NoRoute）。
    # 少了它，直接访问 /qoe、或刷新 /video/3，得到的是 nginx 的 404 页面 ——
    # 而从站内点链接进去却是好的（因为那次不经过 nginx 的路径解析）。
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # 只给 SPA 产物开 gzip。/assets/ 下是 JS/CSS（最大的 hls chunk 约 574 kB），
        # 在 3~6 Mbps 的出口上这个压缩比是实打实的。
        # **不加到 /static/**：那里是已经压过的 .mp4/.ts，再压一遍只烧 CPU 不省字节。
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
