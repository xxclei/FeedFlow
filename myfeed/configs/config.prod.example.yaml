# 生产配置模板。
#
#     cp configs/config.prod.example.yaml configs/config.prod.yaml
#     # 然后把下面三处密码填成和 deploy/.env 里一样的值
#
# configs/config.prod.yaml 被 .gitignore 排除，**不进仓库**。
# 这个 example 文件进仓库（它里面没有真密码）。
#
# 为什么配置是**挂载**进去的而不是打进镜像：镜像是会被推送、导出、分享的东西，
# 而这份文件里有数据库密码。见 deploy/Dockerfile 里"刻意不 COPY configs/"那段。
#
# ============================================================
# ⚠ 三处密码必须和 deploy/.env 里的一致（这是本项目唯一一处刻意的重复）
# ============================================================
#
# config.Load 只做 yaml.Unmarshal，**不做环境变量替换** ——
# 所以 Go 侧拿不到 .env 里的值，只能在这份文件里再写一遍。
# 改了 .env 里的密码，这里也要改。漏改的后果见 deploy/.env.example 顶部。
#
# （唯一的例外是 JWT_SECRET：那个走 os.Getenv，只从环境变量读，不在这份文件里。）
#
# ============================================================
# ⚠ 时区：这三段配置一起构成一个**必须齐步走**的约定
# ============================================================
#
# 需要同时成立的三件事：
#     ① 这份配置里的 host 全是容器名（不是 127.0.0.1）
#     ② api / worker / mysql 三个容器都设了 TZ=Asia/Shanghai
#     ③ 运行镜像里装了 tzdata（否则 TZ 会被忽略，time.Local 仍是 UTC）
#
# 为什么时区这么要紧：internal/db/db.go:59 的 DSN 是 `loc=Local`，
# 而全项目**没有一处**设置 time.Local —— 它的值就是容器进程的 TZ。
# `loc=Local` 决定驱动怎么解释从 DATETIME 列读出来的那串墙钟字面量。
#
# 你这次选的是"只迁 MySQL 数据、素材重传"，所以这条会真的炸：
#
#     迁过来的旧行：create_time 是 **UTC+8 的墙钟字面量**
#     新上传的行：  Go 在 UTC 容器里写 UTC 墙钟 → **比旧行早 8 小时**
#     feed 排序：  ORDER BY create_time DESC
#
#     ⇒ 新上传的视频永远排在旧视频后面，翻到第一页看不见自己刚传的东西。
#
# 不报错、没有任何日志，旧数据全部"来自未来"。
# 判据（也是验证步骤里的第 6 条）：传一条新视频，看它有没有出现在列表最前面。

server:
  port: 8080
  # ⚠ 这一行现在有默认值（config/loadingconfig.go 的 DefaultServerPort）。
  #   上云前它是漏写就变 `:0` 的 —— 而 `:0` 在 net.Listen 里的含义是
  #   "让内核随便挑一个空闲端口"，于是日志一切正常，nginx 反代 8080
  #   得到 connection refused，两边看不出关联。现在漏写只是回到 8080，
  #   但还是写出来：读这份文件的人不该需要去翻代码才知道端口是几。

database:
  # ⚠ 容器名，不是 127.0.0.1。应用跑在容器里，127.0.0.1 是**它自己**。
  host: mysql
  # ⚠ 3306，不是 3307。3307 是开发那份编排里**宿主机**的映射端口；
  #   容器之间走的是容器自己的 3306。
  port: 3306
  user: root
  # ← 必须等于 deploy/.env 的 MYSQL_ROOT_PASSWORD
  password: "CHANGE_ME_mysql_root_pw"
  dbname: myfeed

redis:
  host: redis
  port: 6379
  # ← 必须等于 deploy/.env 的 REDIS_PASSWORD
  #   ⚠ 不一致不会报错，只会静默降级成"缓存禁用"
  password: "CHANGE_ME_redis_pw"
  db: 0

rabbitmq:
  host: rabbitmq
  port: 5672
  # ← 必须等于 deploy/.env 的 RABBITMQ_USER / RABBITMQ_PASSWORD
  #   ⚠ 不一致同样是静默降级成"MQ 降级为同步直写"（api 侧）；
  #     而 **worker 侧 MQ 连不上是直接退出**，所以 worker 会起不来。
  username: myfeed
  password: "CHANGE_ME_rabbitmq_pw"

# 检索参数。整段不写也能跑（search/entity.go 的 withDefaults 兜底），
# 这里显式写出来是为了和开发环境保持同一套数字 —— 换环境不该顺带换检索行为。
search:
  depth: 50              # 召回条数（融合前的候选池，和每页 limit 是两件事）
  rrf_k: 60              # RRF 的 k（Cormack 2009），单路时不影响排序

storage:
  # 上传根目录。
  #
  # ⚠ 这里是**绝对路径**，和开发配置里的相对路径 `./.run/uploads` 不同，
  #   这是刻意的：相对路径是相对**进程工作目录**解释的，而
  #   `storage.UploadRoot` 有**两个进程**要读（api 写 / worker 读）。
  #   绝对路径把"两边 CWD 不一致"这件事从"不能发生"变成"发生了也没关系"。
  #
  # 路径必须和 compose 里 uploads_data 卷的挂载点一致
  # （docker-compose.prod.yml 的 `uploads_data:/data/uploads`）。
  # 不一致的表现是静默的：门禁探测失败 → 全部走"直传" →
  # transcode_status 恒为 'skipped'，日志里是正常的 "probe failed"。
  upload_root: /data/uploads

transcode:
  # ⚠ 必须改成 apt 装的那个 ffmpeg 的路径。
  #
  # 默认值（不写这一行时）是 `./.run/bin/ffmpeg` —— 那是**开发机**上
  # 项目自带的那个（.run/ 被 .dockerignore 排除了，镜像里根本没有）。
  # 不覆盖的话，worker 每条视频转码时 exec 失败：
  # 不是启动期失败，是**上传之后**才失败，表现为 transcode_status
  # 恒为 'failed'，前端自动回落直传原片 —— 看起来"能播"。
  # 判据：`docker compose exec worker /usr/bin/ffmpeg -version`
  ffmpeg_path: /usr/bin/ffmpeg

# 说明：这里**没有** ollama / dim / max_distance 段。向量那一路还没接线，
# 那两个参数目前没有任何读者（写在配置里就是假旋钮，改了没反应）。
# 和开发配置保持一致。
